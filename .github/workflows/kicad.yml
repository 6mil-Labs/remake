name: KiCad

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "hw/**"
      - "cad/components/**"
      - "cad/case/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "hw/**"
      - "cad/components/**"
      - "cad/case/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  case-exports:
    name: Case body STEP exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Use the same FreeCAD version as the CAD sources, without FUSE or a GUI.
      # Pin both the upstream release and its GitHub-published SHA256 digest.
      - name: Install headless FreeCAD 1.1.4
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output freecad.AppImage \
            https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/FreeCAD_1.1.4-Linux-x86_64-py311.AppImage
          printf '%s  %s\n' f6dc6ba676e5ac96a565ebc8d657232f94c6158e85b4352141bd1a46f6b43434 freecad.AppImage | sha256sum --check
          chmod +x freecad.AppImage
          ./freecad.AppImage --appimage-extract > /dev/null

      - name: Test case export and STEP round trips
        run: |
          PYTHONPATH="${RUNNER_TEMP}/squashfs-root/usr/lib" \
            "${RUNNER_TEMP}/squashfs-root/AppRun" python \
            -m unittest discover -s tests -p test_case_exports.py -v

      - name: Export case bodies
        run: |
          PYTHONPATH="${RUNNER_TEMP}/squashfs-root/usr/lib" \
            "${RUNNER_TEMP}/squashfs-root/AppRun" python scripts/export-cases.py build/cases

      - name: Upload case STEP files
        uses: actions/upload-artifact@v7
        with:
          name: case-steps
          path: build/cases/*.step
          if-no-files-found: error

  packaging-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test fabrication packaging
        run: python3 -m unittest discover -s tests -v

  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [erc, drc]
    steps:
      - uses: actions/checkout@v6

      - name: Create report directory
        run: mkdir -p build/kicad

      # actions-for-kicad v2-k10.0; includes split PTH/NPTH drill export support.
      - name: Run ${{ matrix.check }}
        if: matrix.check == 'erc'
        uses: actions-for-kicad/kicad-actions@c37445cbb65e1b9042d108bf0a257ead1ef80393
        with:
          project_file_name: hw/remake.kicad_pro
          schematic_file_name: hw/remake.kicad_sch
          pcb_file_name: hw/remake.kicad_pcb
          run_erc: true
          erc_output_file_name: build/kicad/erc.rpt

      # The generic action has no switches for zone refill or schematic parity.
      # Run the strict DRC in the same upstream KiCad image with both enabled.
      - name: Test tooling and board geometry with real KiCad
        if: matrix.check == 'drc'
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp/kicad-home \
            --volume "$PWD:/workspace" --workdir /workspace \
            kicad/kicad:10.0 bash -ec '
              python3 -c "import pcbnew"
              python3 -m unittest discover -s tests -v
            '

      - name: Run DRC with zone refill and schematic parity
        if: matrix.check == 'drc'
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp/kicad-home \
            --volume "$PWD:/workspace" --workdir /workspace \
            kicad/kicad:10.0 \
            kicad-cli pcb drc --refill-zones --schematic-parity \
              --exit-code-violations --output build/kicad/drc.rpt \
              hw/remake.kicad_pcb

      - name: Upload ${{ matrix.check }} report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kicad-${{ matrix.check }}
          path: build/kicad/${{ matrix.check }}.rpt
          if-no-files-found: warn
